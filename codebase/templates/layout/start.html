<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VLearn International Academy | CP2 - Luồng Hoạt Động (Track D2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/css/foundation.css?v=20000">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=20000">
  <link rel="stylesheet" href="/static/css/learning-flow.css?v=20000">
  <link rel="stylesheet" href="/static/css/blueprint.css?v=20000">
</head>

<body>

  <!-- ================= TOP HACKATHON CP2 CONTROL BAR ================= -->
  <!-- ================= VLEARN ACADEMY HEADER ================= -->
  <header class="vlearn-header">
    <div class="vlearn-left">
      <div class="vlearn-logo" onclick="goToStep(1)">
        <div class="vlearn-logo-icon">
          <!-- Geometric Academic Monogram -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 5L12 20L20 5" stroke="#000000" stroke-width="2.5" stroke-linecap="square"
              stroke-linejoin="miter" />
            <line x1="8" y1="5" x2="16" y2="5" stroke="#000000" stroke-width="2" />
          </svg>
        </div>
        <div class="vlearn-logo-text-wrap">
          <span class="vlearn-logo-text">VLEARN</span>
          <span class="vlearn-logo-sub">International Academy</span>
        </div>
      </div>
      <nav>
        <ul class="vlearn-nav">
          <li class="vlearn-nav-item active" onclick="goToStep(1)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            Home
          </li>
          <li class="vlearn-nav-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            Courses
          </li>
          <li class="vlearn-nav-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            Practice <span class="vlearn-nav-badge badge-soon">Soon</span>
          </li>
          <li class="vlearn-nav-item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 2v7.31"></path>
              <path d="M14 9.3V2"></path>
              <path d="M8.5 2h7"></path>
              <path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path>
            </svg>
            Lab <span class="vlearn-nav-badge badge-new">New</span>
          </li>
        </ul>
      </nav>
    </div>
    <div class="vlearn-right">
      <div class="lang-toggle">
        <span class="lang-opt">EN</span>
        <span class="lang-opt active">VI</span>
      </div>
      <button class="icon-btn" title="Giao diện tối">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <button class="icon-btn" title="Thông báo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <button class="account-switch-button" id="account-switch-button" type="button" onclick="switchAccount()">
        Đổi tài khoản
      </button>
      <div class="user-avatar" id="current-user-avatar" title="Học viên">HV</div>
    </div>
  </header>

  <!-- ================= AUTH GATE (must be OUTSIDE main.container) ================= -->
  <div class="auth-gate" id="auth-gate">
    <div class="auth-card" style="position: relative;">
      <button class="citation-close" type="button" aria-label="Đóng" onclick="closeAuthGate()"
        style="position: absolute; top: 16px; right: 16px;">×</button>
      <div class="eyebrow">VLEARN · NHẬN DIỆN NGƯỜI DÙNG</div>
      <h1>Vào không gian học tập</h1>
      <div class="auth-tabs">
        <button class="auth-tab active" id="auth-tab-student" type="button" onclick="switchAuthRole('student')">Học
          viên</button>
        <button class="auth-tab" id="auth-tab-teacher" type="button" onclick="switchAuthRole('teacher')">Giảng
          viên</button>
      </div>
      <form id="student-login-form" onsubmit="loginStudent(event)">
        <label for="student-code">Mã sinh viên</label>
        <input id="student-code" name="student-code" autocomplete="username" maxlength="40" required
          placeholder="Nhập mã sinh viên (ví dụ: SV2026001)">
        <div style="margin-top: 8px; font-size: 12px; color: var(--charcoal);">
          Mã thử mẫu: <a href="javascript:void(0)" onclick="document.getElementById('student-code').value='SV2026001'"
            style="text-decoration: underline; font-weight: bold;">SV2026001</a> · <a href="javascript:void(0)"
            onclick="document.getElementById('student-code').value='SV2026002'"
            style="text-decoration: underline; font-weight: bold;">SV2026002</a>
        </div>
        <button class="btn-primary" type="submit" style="margin-top: 14px;">Bắt đầu học →</button>
      </form>
      <form id="teacher-login-form" style="display:none" onsubmit="loginTeacher(event)">
        <label for="teacher-username">Tài khoản giảng viên</label>
        <input id="teacher-username" autocomplete="username" required placeholder="admin" value="admin">
        <label for="teacher-password">Mật khẩu</label>
        <input id="teacher-password" type="password" autocomplete="current-password" required placeholder="admin"
          value="admin">
        <button class="btn-primary" type="submit" style="margin-top: 14px;">Mở báo cáo lớp →</button>
      </form>
      <p class="auth-error" id="auth-error" role="alert"></p>
    </div>
  </div>

  <!-- ================= INSTRUCTOR PANEL (must be OUTSIDE main.container) ================= -->
  <section class="instructor-panel" id="instructor-panel" style="display:none">
    <div class="instructor-panel-head">
      <div>
        <div class="eyebrow">VLEARN · GIẢNG VIÊN</div>
        <h1>Báo cáo lớp học</h1>
      </div>
      <button class="btn-secondary" type="button" onclick="logoutUser()">Đăng xuất</button>
    </div>
    <div id="instructor-report-content"></div>
  </section>

  <!-- ================= MAIN CONTAINER ================= -->
  <main class="container">

    <!-- VIEW 1: INTERACTIVE PROTOTYPE (SCREENS 1 TO 5) -->
    <div id="interactive-view">
